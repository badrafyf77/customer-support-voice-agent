services:
  # FastAPI voice backend, using OpenAI as the LLM provider (no local vLLM server).
  app:
    build:
      context: .
      args:
        STT_MODEL: ${STT_MODEL:-medium.en}
        STT_REALTIME_MODEL: ${STT_REALTIME_MODEL:-small.en}
        STT_USE_MAIN_MODEL_FOR_REALTIME: ${STT_USE_MAIN_MODEL_FOR_REALTIME:-true}
    image: voice-agent-backend:openai
    container_name: voice-agent-backend
    ports:
      - "8080:8000"
    environment:
      # --- LLM Configuration (OpenAI) ---
      - LLM_PROVIDER=openai
      - LLM_MODEL=${LLM_MODEL:-gpt-5.4-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VOICE_AGENT=${VOICE_AGENT:-support}

      # --- LangSmith (optional): traces of every agent run ---
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-shopeasy-voice-agent}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}

      # --- Other App Environment Variables ---
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_AUDIO_QUEUE_SIZE=${MAX_AUDIO_QUEUE_SIZE:-50}
      - VOICE_RUNTIME_MIN_WARM=${VOICE_RUNTIME_MIN_WARM:-1}
      - VOICE_RUNTIME_MAX_CONCURRENT=${VOICE_RUNTIME_MAX_CONCURRENT:-1}
      - VOICE_RUNTIME_IDLE_TTL_SECONDS=${VOICE_RUNTIME_IDLE_TTL_SECONDS:-300}
      - VOICE_RUNTIME_ACQUIRE_TIMEOUT_SECONDS=${VOICE_RUNTIME_ACQUIRE_TIMEOUT_SECONDS:-30}
      - STT_MODEL=${STT_MODEL:-medium.en}
      - STT_REALTIME_MODEL=${STT_REALTIME_MODEL:-small.en}
      - STT_USE_MAIN_MODEL_FOR_REALTIME=${STT_USE_MAIN_MODEL_FOR_REALTIME:-true}
      - TURN_DETECTION_DEVICE=${TURN_DETECTION_DEVICE:-cpu}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/home/appuser/.cache/huggingface
      - TORCH_HOME=/home/appuser/.cache/torch
    volumes:
      - huggingface_cache:/home/appuser/.cache/huggingface
      - torch_cache:/home/appuser/.cache/torch
      # One trace file per call, and the ShopEasy database, kept on the host.
      - ./logs:/app/logs
      - ./data:/app/data
    # Remove this whole "deploy" block if your cloud VM has no NVIDIA GPU.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    restart: unless-stopped

volumes:
  huggingface_cache:
    driver: local
  torch_cache:
    driver: local
