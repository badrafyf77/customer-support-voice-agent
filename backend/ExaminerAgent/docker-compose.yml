services:
  # Your FastAPI Application Service
  app:
    build:
      context: .
      args:
        STT_MODEL: ${STT_MODEL:-medium.en}
        STT_REALTIME_MODEL: ${STT_REALTIME_MODEL:-small.en}
        STT_USE_MAIN_MODEL_FOR_REALTIME: ${STT_USE_MAIN_MODEL_FOR_REALTIME:-true}
    image: examiner-agent:latest
    container_name: examiner-agent-app
    ports:
      - "8080:8000" # Changed to 8080 since vLLM uses 8000
    environment:
      # --- LLM Configuration (vLLM) ---
      - LLM_PROVIDER=vllm
      - LLM_MODEL=Qwen/Qwen2.5-72B-Instruct-AWQ
      - VLLM_BASE_URL=http://vllm:8000/v1
      - VLLM_STARTUP_TIMEOUT_SECONDS=${VLLM_STARTUP_TIMEOUT_SECONDS:-180}
      - VLLM_HEALTHCHECK_INTERVAL_SECONDS=${VLLM_HEALTHCHECK_INTERVAL_SECONDS:-2}

      # --- Other App Environment Variables ---
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - MAX_AUDIO_QUEUE_SIZE=${MAX_AUDIO_QUEUE_SIZE:-50}
      - VOICE_RUNTIME_MIN_WARM=${VOICE_RUNTIME_MIN_WARM:-1}
      - VOICE_RUNTIME_MAX_CONCURRENT=${VOICE_RUNTIME_MAX_CONCURRENT:-1}
      - VOICE_RUNTIME_IDLE_TTL_SECONDS=${VOICE_RUNTIME_IDLE_TTL_SECONDS:-300}
      - VOICE_RUNTIME_ACQUIRE_TIMEOUT_SECONDS=${VOICE_RUNTIME_ACQUIRE_TIMEOUT_SECONDS:-30}
      - STT_MODEL=${STT_MODEL:-medium.en}
      - STT_REALTIME_MODEL=${STT_REALTIME_MODEL:-small.en}
      - STT_USE_MAIN_MODEL_FOR_REALTIME=${STT_USE_MAIN_MODEL_FOR_REALTIME:-true}
      - TURN_DETECTION_DEVICE=${TURN_DETECTION_DEVICE:-cpu}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - EVALUATOR_AGENT_BASE_URL=${EVALUATOR_AGENT_BASE_URL:-http://162.243.59.37:8090}
      - EVALUATOR_TRIGGER_TIMEOUT_SECONDS=${EVALUATOR_TRIGGER_TIMEOUT_SECONDS:-5}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/home/appuser/.cache/huggingface
      - TORCH_HOME=/home/appuser/.cache/torch
    volumes:
      # Mount cache directories
      - huggingface_cache:/home/appuser/.cache/huggingface
      - torch_cache:/home/appuser/.cache/torch
    depends_on:
      vllm:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    restart: unless-stopped

  # vLLM Server Service - Balanced for LLM + STT/VAD/TTS on same GPU
  vllm:
    image: vllm/vllm-openai:latest
    container_name: examiner-agent-vllm
    ports:
      - "8000:8000"
    command:
      - Qwen/Qwen2.5-72B-Instruct-AWQ
      - --dtype=auto
      - --max-model-len=6144
      - --gpu-memory-utilization=0.8
      - --max-num-seqs=24
      - --enable-chunked-prefill
      - --max-num-batched-tokens=8192
      - --tensor-parallel-size=1
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 40s
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    restart: unless-stopped
    shm_size: "8gb" # Balanced shared memory

# Define named volumes for persistent data
volumes:
  huggingface_cache:
    driver: local
  torch_cache:
    driver: local
