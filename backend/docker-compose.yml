name: darija-voice

# Reuse stable configuration; each service below owns its command and dependencies.
x-build: &build
  context: .
  dockerfile: Dockerfile.darija

x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 120
  start_period: 60s

x-environment: &environment
  DARIJA_STATE_ROOT: /opt/darija
  DARIJA_MODEL_ROOT: /models
  HF_HOME: /cache/huggingface
  TORCH_HOME: /cache/torch
  VOICE_AGENT: chat
  VOICE_PROFILE: darija
  STT_MODEL: /models/asr
  STT_REALTIME_MODEL: /models/asr
  STT_USE_MAIN_MODEL_FOR_REALTIME: "true"
  TURN_DETECTION_DEVICE: cpu
  TURN_DETECTION_MODEL: /models/turn
  LLM_PROVIDER: vllm
  LLM_MODEL: MBZUAI-Paris/Atlas-Chat-2B
  VLLM_BASE_URL: http://vllm:8001/v1
  SILMA_TTS_BASE_URL: http://silma:8002
  VOICE_RUNTIME_MIN_WARM: "1"
  VOICE_RUNTIME_MAX_CONCURRENT: "1"
  NVIDIA_DRIVER_CAPABILITIES: compute,utility

x-gpu: &gpu
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

x-service: &service
  platform: linux/amd64
  env_file: .env
  environment: *environment
  init: true
  stop_grace_period: 45s
  volumes:
    - models:/models:ro
    - model_cache:/cache

services:
  # 1. CPU-only: HF download -> safe adapter merge -> CT2 export -> hash checks.
  prepare-models:
    <<: *service
    image: darija-voice-prepare:local
    build:
      <<: *build
      target: prepare
    command: [prepare]
    volumes:
      - models:/models
      - model_cache:/cache
    restart: "no"

  # 2. Start Atlas before other GPU models so it can profile its memory budget.
  vllm:
    <<: *service
    image: darija-voice-vllm:local
    build:
      <<: *build
      target: vllm
    command: [vllm]
    environment:
      <<: *environment
      VLLM_BIND_HOST: 0.0.0.0
      DARIJA_VALIDATION_PYTHON: /opt/darija/vllm/bin/python
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.40}
    depends_on:
      prepare-models:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      test: [CMD, /opt/darija/vllm/bin/python, /app/studio/container_health.py, vllm]
    deploy: *gpu
    shm_size: 4gb
    restart: unless-stopped

  # 3. Load/cache the selected voice only after Atlas reports ready.
  silma:
    <<: *service
    image: darija-voice-silma:local
    build:
      <<: *build
      target: silma
    command: [silma]
    environment:
      <<: *environment
      SILMA_BIND_HOST: 0.0.0.0
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /opt/darija/silma/bin/python, /app/studio/container_health.py, silma]
    deploy: *gpu
    shm_size: 2gb
    restart: unless-stopped

  # 4. Warm the one voice runtime and publish only its HTTP/WebSocket port.
  app:
    <<: *service
    image: darija-voice-backend:local
    build:
      <<: *build
      target: backend
    command: [backend]
    environment:
      <<: *environment
      VOICE_BIND_HOST: 0.0.0.0
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      silma:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, /opt/darija/backend/bin/python, /app/studio/container_health.py, backend]
    deploy: *gpu
    shm_size: 2gb
    restart: unless-stopped

volumes:
  models:
  model_cache:
