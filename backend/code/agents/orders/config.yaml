# The orders agent works in the background and must follow the rules
# carefully, so it uses a stronger model than the supervisor.
llm_provider: openai
llm_model: gpt-5.5
# GPT-5 models only accept tools together with a reasoning effort through
# OpenAI's Responses API (checked 2026-11-09), so the agents use it.
use_responses_api: true
reasoning_effort: medium
max_tool_calls: 5
