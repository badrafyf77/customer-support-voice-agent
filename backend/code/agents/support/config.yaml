stt_model: medium.en
stt_realtime_model: small.en
tts_voice:
tts_engine: kokoro
# The supervisor talks to the customer, so it uses a fast model.
llm_provider: openai
llm_model: gpt-5.4-mini
# The Chat Completions API only accepts tools with reasoning_effort "none"
# (checked 2026-11-09). Thinking with tools would need the Responses API.
reasoning_effort: none
language: en
# Limits
max_tool_calls: 5
call_warning_seconds: 840  # 14 minutes
call_limit_seconds: 900    # 15 minutes
